$schema: https://moonrepo.dev/schemas/project.json

tasks:
  build:
    command: tsdown
    inputs:
      - src/**/*
    outputs:
      - dist
  dev:
    command: vite
    options:
      runInCI: true
  lint:
    command:
      - oxlint
      - .
  lint-fix:
    command:
      - oxlint
      - --fix
      - .
    preset: server
  test:
    command: noop
    deps:
      - ~:test-unit
      - ~:test-e2e
    toolchains: node
  test-e2e:
    command:
      - playwright
      - test
  test-unit:
    command: vitest
