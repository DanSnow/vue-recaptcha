$schema: https://moonrepo.dev/schemas/project.json

dependsOn:
  - vue-recaptcha

tasks:
  dev:
    command:
      - nuxt
      - dev
    deps:
      - ^:build
    preset: server
  generate:
    command:
      - nuxt
      - generate
    deps:
      - ^:build
    inputs:
      - content/**
      - components/**
      - layouts/**
      - public/**
      - app.config.ts
      - app.vue
      - nuxt.config.ts
      - tokens.config.ts
  prepare-test:
    deps:
      - generate
  test-unit:
    command: vitest
    deps:
      - prepare-test
    inputs:
      - tests/**
      - vite.config.mts
    toolchains: node
  test:
    deps:
      - test-unit
  check-200-html:
    command:
      - test
      - -f
      - .output/public/200.html
    deps:
      - ~:generate
    inputs:
      - .output/public/200.html
    toolchains: system
  check-nuxt-dir:
    command:
      - test
      - -d
      - .output/public/_nuxt
    deps:
      - ~:generate
    inputs:
      - .output/public/_nuxt
    toolchains: system
  generate-github-pages-fallback:
    command:
      - cp
      - .output/public/200.html
      - .output/public/404.html
    deps:
      - ~:check-200-html
    inputs:
      - .output/public/200.html
    outputs:
      - .output/public/404.html
    toolchains: system
  generate-with-nojekyll:
    command:
      - touch
      - .output/public/.nojekyll
    deps:
      - ~:check-200-html
      - ~:check-nuxt-dir
      - ~:generate-github-pages-fallback
    outputs:
      - .output/public/.nojekyll
    toolchains: system
  publish:
    command:
      - gh-pages
      - -d
      - .output/public
      - -t
    deps:
      - ~:generate-with-nojekyll
